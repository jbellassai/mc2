<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magic Candle II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* After the original frame (VSCRA.MCE): grey stone with light and dark bevels, gold lettering. */
  :root {
    --bg: #121110; --stone: #2b2925; --stone-hi: #4d4a43; --stone-lo: #151412; --ink: #e6e1d6; --dim: #a39d90;
    --gold: #b08d3e; --gold-hi: #f0cf72; --hp: #c0453b; --en: #4f86c6; --title: 'Cinzel', Georgia, serif;
  }
  html, body { margin: 0; min-height: 100%; background: radial-gradient(ellipse at top, #24211c, var(--bg) 70%) fixed; color: var(--ink);
    font: 14px/1.4 system-ui, sans-serif; }
  body { display: flex; justify-content: center; padding: 12px; box-sizing: border-box; }
  [hidden] { display: none !important; }
  .stone { background: var(--stone); border: 3px solid; border-color: var(--stone-hi) var(--stone-lo) var(--stone-lo) var(--stone-hi);
    border-radius: 6px; box-shadow: 0 6px 24px rgb(0 0 0 / .5); }
  #game { display: flex; gap: 12px; align-items: flex-start; }
  #stage { display: flex; flex-direction: column; gap: 8px; align-items: stretch; width: min(1008px, calc(70vh * 1.4 + 18px), calc(100vw - 290px)); }
  .frame { padding: 6px; line-height: 0; }
  #view { image-rendering: pixelated; width: 100%; height: auto; background: #000; border-radius: 2px; }
  #status:empty { display: none; }
  #status { min-height: 1.4em; padding: 5px 12px; text-align: center; color: var(--gold-hi); font-size: 13px; letter-spacing: .02em; }
  #panel { padding: 8px 12px; box-sizing: border-box; }
  #log { max-height: 22em; overflow-y: auto; white-space: pre-wrap; margin-bottom: 6px; }
  #log .you { color: #9cf; }
  #ask { display: flex; margin-bottom: 6px; }
  #ask input { flex: 1; background: #161513; color: var(--ink); border: 1px solid var(--stone-hi); border-radius: 4px; padding: 4px 6px; font: inherit; }
  #buttons { display: flex; gap: 6px; flex-wrap: wrap; }
  .sheets { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .sheet caption { text-align: left; font-weight: 600; padding-bottom: 2px; color: var(--gold-hi); }
  .sheet td { padding: 0 10px 0 0; } .sheet td:last-child { text-align: right; color: #fc9; }
  button { font: inherit; color: var(--ink); cursor: pointer; }
  #buttons button, #commands button { display: inline-flex; align-items: center; justify-content: space-between; gap: 8px;
    background: linear-gradient(#3a3730, #2a2823); border: 1px solid; border-color: var(--stone-hi) var(--stone-lo) var(--stone-lo) var(--stone-hi);
    border-radius: 4px; padding: 4px 8px 4px 10px; }
  #buttons button:hover, #commands button:hover:not(:disabled), button:focus-visible { border-color: var(--gold); outline: none; color: var(--gold-hi); }
  #commands button:disabled { opacity: .45; cursor: default; }
  kbd { font: 600 11px/1 ui-monospace, monospace; color: var(--gold-hi); background: #1a1916; border: 1px solid #5a5040; border-bottom-width: 2px;
    border-radius: 3px; padding: 2px 4px; min-width: 1em; text-align: center; }
  #side { width: 250px; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; }
  .brand { margin: 0; text-align: center; font: 700 20px/1.15 var(--title); color: var(--gold-hi); text-shadow: 0 2px 0 #5a2a5a, 0 0 12px rgb(240 207 114 / .25); }
  .brand span { display: block; font-size: 28px; }
  #side h2 { margin: 0 0 6px; font: 600 12px var(--title); letter-spacing: .12em; color: var(--gold); border-bottom: 1px solid #4a4335; padding-bottom: 3px; }
  #party { display: flex; flex-direction: column; gap: 6px; }
  .member { display: grid; grid-template-columns: 1.2em 1fr auto; gap: 1px 6px; align-items: center; padding: 3px 4px; border-radius: 4px; cursor: pointer; }
  .member:hover { background: #35322b; }
  .member .n { grid-row: span 3; font: 700 15px var(--title); color: var(--gold); text-align: center; }
  .member .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .member .state { font-size: 11px; color: var(--dim); }
  .member.bad .state { color: #f08070; }
  .bar { grid-column: 2 / 4; height: 5px; background: #171614; border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; transition: width .3s; }
  .bar.hp i { background: linear-gradient(90deg, #8a2b24, var(--hp)); } .bar.en i { background: linear-gradient(90deg, #2c4f7c, var(--en)); }
  #commands { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .hint { margin: 0; font-size: 12px; color: var(--dim); line-height: 1.6; }
  @media (max-width: 760px) {
    #stage { width: calc(100vw - 24px); }
    #game { flex-direction: column; align-items: stretch; }
    #side { width: auto; } #commands { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
  }
</style>
</head>
<body>
<div id="game">
  <main id="stage">
    <div class="frame stone"><canvas id="view"></canvas></div>
    <div id="status" class="stone">Loading…</div>
    <div id="panel" class="stone" hidden>
      <div id="log"></div>
      <form id="ask"><input id="word" autocomplete="off"></form>
      <div id="buttons"></div>
    </div>
  </main>
  <aside id="side" class="stone" hidden>
    <h1 class="brand">The Magic Candle <span>II</span></h1>
    <section><h2>PARTY</h2><div id="party"></div></section>
    <section><h2>COMMANDS</h2><div id="commands"></div></section>
    <p class="hint"><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move (arrows in a fight).
      In menus, press the key shown on a button.</p>
  </aside>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
