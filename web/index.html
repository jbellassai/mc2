<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magic Candle II</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  canvas { image-rendering: pixelated; max-width: 100vw; max-height: 85vh; }
  [hidden] { display: none !important; }
  #status { min-height: 1.4em; }
  #panel { width: min(1008px, 96vw); background: #1d1d24; border: 1px solid #444; padding: 8px 12px; box-sizing: border-box; }
  #log { max-height: 22em; overflow-y: auto; white-space: pre-wrap; margin-bottom: 6px; }
  #log .you { color: #9cf; }
  #ask { display: flex; margin-bottom: 6px; }
  #ask input { flex: 1; background: #111; color: #eee; border: 1px solid #555; padding: 4px 6px; font: inherit; }
  #buttons { display: flex; gap: 6px; }
  .sheets { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .sheet caption { text-align: left; font-weight: 600; padding-bottom: 2px; }
  .sheet td { padding: 0 10px 0 0; } .sheet td:last-child { text-align: right; color: #fc9; }
  #buttons button { background: #333; color: #eee; border: 1px solid #555; padding: 4px 10px; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="status">Loading…</div>
<div id="panel" hidden>
  <div id="log"></div>
  <form id="ask"><input id="word" autocomplete="off"></form>
  <div id="buttons"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
